spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/safehelmet?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

ai:
  server:
    url: http://localhost:5000

server:
  port: 8080

internal:
  api:
    # 기본값을 두지 않는다. 미주입 시 기동에 실패시켜 인증 없는 내부 API 가 열리는 걸 막는다.
    key: ${INTERNAL_API_KEY}

clip:
  storage:
    enabled: true
    region: ${AWS_REGION:ap-northeast-2}
    presign-ttl: 15m
