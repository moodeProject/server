spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/safehelmet?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

ai:
  server:
    url: http://localhost:5000

server:
  port: 8080
