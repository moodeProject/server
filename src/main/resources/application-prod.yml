spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/safehelmet?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

ai:
  server:
    url: http://localhost:5000

server:
  port: 8080

internal:
  api:
    # 기본값을 두지 않는다. 미주입 시 기동에 실패시켜 인증 없는 내부 API 가 열리는 걸 막는다.
    key: ${INTERNAL_API_KEY}

jwt:
  # 기본값을 두지 않는다. 미주입 시 기동 실패 — internal.api.key 와 같은 이유.
  secret: ${JWT_SECRET}

auth:
  admin:
    # 데모 시연 때만 EC2 systemd 환경변수로 true 로 켰다가, 끝나면 다시 false(또는 제거)로 되돌릴 것.
    auto-approve-signup: ${AUTH_ADMIN_AUTO_APPROVE:false}

demo:
  worker:
    default-password: ${DEMO_WORKER_PASSWORD:}

clip:
  storage:
    enabled: true
    region: ${AWS_REGION:ap-northeast-2}
    presign-ttl: 15m

weather:
  api:
    url: https://apis.data.go.kr
    service-key: ${WEATHER_SERVICE_KEY:}
  site:
    nx: ${WEATHER_SITE_NX:60}
    ny: ${WEATHER_SITE_NY:127}
