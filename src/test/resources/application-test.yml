# 통합 테스트용. MySQL 대신 H2(MySQL 호환 모드)를 쓴다.
spring:
  datasource:
    url: jdbc:h2:mem:hazard;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

ai:
  server:
    url: http://localhost:5000

internal:
  api:
    key: test-internal-key

hazard:
  severity:
    puddle: WARNING
    pothole: WARNING
    forklift: DANGER

  stream:
    timeout-millis: 0
    heartbeat-millis: 30000

clip:
  storage:
    enabled: false
    local-base-url: http://localhost:8080/clips

weather:
  api:
    url: http://localhost:9999
    service-key: test-key
  site:
    nx: 60
    ny: 127
